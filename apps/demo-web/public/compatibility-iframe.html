<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>Compatibility iframe</title>
    <style>
      :root {
        color: #17202a;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        background: #ffffff;
      }

      body {
        margin: 0;
        padding: 18px;
      }

      form {
        display: grid;
        gap: 12px;
      }

      label {
        display: grid;
        gap: 6px;
        color: #415066;
        font-size: 14px;
      }

      input,
      button {
        min-height: 36px;
        border-radius: 6px;
        font: inherit;
      }

      input {
        border: 1px solid #b9c2d0;
        padding: 0 10px;
      }

      button {
        border: 1px solid #1f63ff;
        padding: 0 12px;
        color: #ffffff;
        background: #1f63ff;
      }
    </style>
  </head>
  <body data-compatibility-iframe>
    <form>
      <label>
        Iframe comment
        <input data-testid="iframe-comment" value="Nested context" />
      </label>
      <button data-testid="iframe-submit" type="button">Submit iframe form</button>
    </form>
  </body>
</html>
