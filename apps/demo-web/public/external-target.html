<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>External target harness</title>
    <style>
      :root {
        color: #17202a;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f7f8fa;
      }

      body {
        margin: 0;
      }

      main {
        display: grid;
        max-width: 760px;
        gap: 18px;
        margin: 0 auto;
        padding: 40px 24px;
      }

      h1 {
        margin: 0;
        font-size: 26px;
      }

      p {
        margin: 0;
        color: #415066;
        line-height: 1.5;
      }

      form {
        display: grid;
        gap: 16px;
        padding: 24px;
        border: 1px solid #d8dee8;
        border-radius: 6px;
        background: #ffffff;
      }

      label {
        display: grid;
        gap: 8px;
        color: #415066;
        font-size: 14px;
      }

      input,
      select,
      button {
        min-height: 40px;
        border-radius: 6px;
        font: inherit;
      }

      input,
      select {
        border: 1px solid #b9c2d0;
        padding: 0 12px;
      }

      button {
        border: 1px solid #1f63ff;
        padding: 0 14px;
        color: #ffffff;
        background: #1f63ff;
        cursor: pointer;
      }

      button + button {
        color: #243246;
        border-color: #b9c2d0;
        background: #ffffff;
      }
    </style>
  </head>
  <body data-external-target>
    <main>
      <h1>External target checkout</h1>
      <p>
        This page is intentionally standalone. Use the bookmarklet from the main demo to
        capture one of these controls.
      </p>
      <form>
        <label>
          Customer name
          <input data-testid="customer-name" value="Grace Hopper" />
        </label>
        <label>
          Billing plan
          <select data-testid="billing-plan">
            <option>Starter</option>
            <option selected>Team</option>
            <option>Enterprise</option>
          </select>
        </label>
        <button data-testid="approve-invoice" type="button">Approve invoice</button>
        <button type="button">Cancel review</button>
      </form>
    </main>
  </body>
</html>
